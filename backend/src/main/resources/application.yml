spring:
  application:
    name: documind-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-at-least-32-bytes-long-2026}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  storage:
    local-root: ${LOCAL_STORAGE_ROOT:./data/uploads}

logging:
  level:
    org.springframework.security: INFO
